# Workflow name (can be customized)
name: Deploy GitHub Pages

# Trigger: runs automatically when code is pushed to the main branch
on:
  push:
    branches:
      - main

# ghaction-github-pages needs contents:write to push the gh-pages branch
permissions:
  contents: write

# Jobs
jobs:
  build-and-deploy:
    # Runner environment: latest Ubuntu (version can be customized)
    runs-on: ubuntu-latest
    steps:
      # Check out the source code
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      # Set up the Node.js version
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Install yarn
      - name: Install yarn
        run: npm i yarn -g

      # Install dependencies if the cache misses
      - name: Install dependencies
        run: cd documents && yarn install

      # Build the static site
      - name: Build
        run: cd documents && yarn docs:build

      # Deploy to GitHub Pages
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v2
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in repository token; use a custom PAT secret for cross-repo deploys
        with:
          target_branch: gh-pages # Deploy to the gh-pages branch: main holds the source, gh-pages holds the generated static files
          build_dir: documents/docs/.vitepress/dist # Directory where VitePress writes the generated static files