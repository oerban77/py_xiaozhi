name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('android_app/pubspec.lock') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .

      - name: Set Android app metadata and permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="py_xiaozhi_android"/android:label="Xiaozhi"/' "$MANIFEST"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          printf '\nandroid.ndk.suppressMinSdkVersionError=21\n' >> android/gradle.properties

      - name: Resolve packages
        run: flutter pub get

      - name: Raise opus_flutter_android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_GRADLE="$(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev" -path '*/opus_flutter_android-*/android/build.gradle' -print -quit)"
          if [ -z "$PLUGIN_GRADLE" ]; then
            echo "::error::opus_flutter_android Gradle file was not found in PUB_CACHE"
            exit 1
          fi
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/' "$PLUGIN_GRADLE"
          grep -n 'compileSdkVersion' "$PLUGIN_GRADLE"

      - name: Analyze Dart sources
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14