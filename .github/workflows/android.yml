name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('android_app/pubspec.lock') }}

      - name: Install Android SDK platforms and build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-33" "build-tools;33.0.2" "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .

      - name: Align Gradle and AGP versions with Android plugin requirements
        shell: bash
        run: |
          set -euo pipefail

          # AGP 8.9.x requires Gradle 9.3.1
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          EOF

          if [ -f android/build.gradle ]; then
            python - <<'PY'
from pathlib import Path
p = Path('android/build.gradle')
text = p.read_text()
if 'com.android.tools.build:gradle' in text:
    text = text.replace("com.android.tools.build:gradle:8.7.2", "com.android.tools.build:gradle:8.9.2")
    text = text.replace("com.android.tools.build:gradle:8.9.0", "com.android.tools.build:gradle:8.9.2")
    text = text.replace("com.android.tools.build:gradle:8.10", "com.android.tools.build:gradle:8.9.2")
else:
    text = """buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.2'
    }
}

""" + text
p.write_text(text)
PY
          fi

          if [ -f android/app/build.gradle ]; then
            python - <<'PY'
from pathlib import Path
p = Path('android/app/build.gradle')
text = p.read_text()
replacements = {
    'compileSdkVersion flutter.compileSdkVersion': 'compileSdkVersion 36',
    'minSdkVersion flutter.minSdkVersion': 'minSdkVersion 24',
    'sourceCompatibility JavaVersion.VERSION_1_8': 'sourceCompatibility JavaVersion.VERSION_17',
    'targetCompatibility JavaVersion.VERSION_1_8': 'targetCompatibility JavaVersion.VERSION_17',
    'sourceCompatibility JavaVersion.VERSION_11': 'sourceCompatibility JavaVersion.VERSION_17',
    'targetCompatibility JavaVersion.VERSION_11': 'targetCompatibility JavaVersion.VERSION_17',
}
for old, new in replacements.items():
    text = text.replace(old, new)

if 'coreLibraryDesugaringEnabled true' not in text and 'compileOptions {' in text:
    text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
if 'kotlinOptions' not in text and 'android {' in text:
    text = text.replace('android {', 'android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }', 1)
if 'packagingOptions' not in text and 'android {' in text:
    text = text.replace('android {', 'android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
if 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' not in text and 'dependencies {' in text:
    text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"', 1)
p.write_text(text)
PY
          fi

          if [ -f android/app/build.gradle.kts ]; then
            python - <<'PY'
from pathlib import Path
p = Path('android/app/build.gradle.kts')
text = p.read_text()
text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
text = text.replace('sourceCompatibility = JavaVersion.VERSION_1_8', 'sourceCompatibility = JavaVersion.VERSION_17')
text = text.replace('targetCompatibility = JavaVersion.VERSION_1_8', 'targetCompatibility = JavaVersion.VERSION_17')
text = text.replace('sourceCompatibility = JavaVersion.VERSION_11', 'sourceCompatibility = JavaVersion.VERSION_17')
text = text.replace('targetCompatibility = JavaVersion.VERSION_11', 'targetCompatibility = JavaVersion.VERSION_17')
if 'isCoreLibraryDesugaringEnabled = true' not in text and 'compileOptions {' in text:
    text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
if 'jvmTarget = "17"' not in text and 'kotlinOptions {' in text:
    text = text.replace('jvmTarget = "11"', 'jvmTarget = "17"')
if 'useLegacyPackaging = true' not in text and 'android {' in text:
    text = text.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text and 'dependencies {' in text:
    text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
p.write_text(text)
PY
          fi

          printf '\nandroid.ndk.suppressMinSdkVersionError=21\n' >> android/gradle.properties

      - name: Set Android app metadata and permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="py_xiaozhi_android"/android:label="Xiaozhi"/' "$MANIFEST" || true
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST" || true
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST" || true
          sed -i '/<\/application>/i\    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" />' "$MANIFEST" || true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK (verbose)
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
