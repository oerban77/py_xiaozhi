name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('android_app/pubspec.lock') }}

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .

      - name: Set Android app metadata and permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="py_xiaozhi_android"/android:label="Xiaozhi"/' "$MANIFEST"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-perm[...]
          sed -i '/<\/application>/i\    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n    <receiver android:exported=[...]

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

            # enable core library desugaring in Kotlin DSL
            perl -0777 -i -pe 's/compileOptions\s*\{\s*/$&\n        isCoreLibraryDesugaringEnabled = true\n/s' android/app/build.gradle.kts
            perl -0777 -i -pe 's/(dependencies\s*\{\s*)/$1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n/s' android/app/build.gradle.kts

          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle

            # enable core library desugaring (robust insertion using perl to handle indentation)
            perl -0777 -i -pe 's/compileOptions\s*\{\s*/$&\n        coreLibraryDesugaringEnabled true\n/s' android/app/build.gradle

            # add the desugar_jdk_libs dependency inside the dependencies block (robust insertion)
            perl -0777 -i -pe 's/(dependencies\s*\{\s*)/$1\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n/s' android/app/build.gradle
          fi

          printf '\nandroid.ndk.suppressMinSdkVersionError=21\n' >> android/gradle.properties

      - name: Resolve packages
        run: flutter pub get

      - name: Resolve packages again
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
