name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          # Accept licenses without failing on broken pipe
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail

          # Install platforms & build-tools
          # compileSdk 36 is required by transitive AndroidX deps pulled in by the
          # Flutter plugins (androidx.camera:* 1.6.1, androidx.core 1.17.0,
          # androidx.media3 1.9.0 all declare compileSdk 35/36 in their AAR
          # metadata). android-34 is kept as a fallback for older build-tools.
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Android project structure
        working-directory: android_app
        run: |
          # If android folder doesn't exist, create it via flutter
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .
          fi

      - name: Configure Android app settings
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail

          # Ensure the app can open sockets and reach HTTP-only media endpoints
          python - <<'PY'
          import re
          from pathlib import Path

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          text = manifest_path.read_text(encoding='utf-8') if manifest_path.exists() else (
              '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    xmlns:tools="http://schemas.android.com/tools">\n'
              '    <application\n        android:label="py_xiaozhi_android"\n        android:name="${applicationName}"\n'
              '        android:icon="@mipmap/ic_launcher">\n'
              '        <activity\n            android:name=".MainActivity"\n'
              '            android:exported="true"\n'
              '            android:launchMode="singleTop"\n'
              '            android:theme="@style/LaunchTheme"\n'
              '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"\n'
              '            android:hardwareAccelerated="true"\n'
              '            android:windowSoftInputMode="adjustResize">\n'
              '            <meta-data\n              android:name="io.flutter.embedding.android.NormalTheme"\n'
              '              android:resource="@style/NormalTheme" />\n'
              '            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n'
              '                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n'
              '        </activity>\n        <meta-data\n            android:name="flutterEmbedding"\n'
              '            android:value="2" />\n    </application>\n</manifest>\n'
          )

          # The tools namespace must be bound before any tools:replace attribute is
          # used below, otherwise AAPT fails with "unbound prefix".
          if 'xmlns:tools="http://schemas.android.com/tools"' not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*?)(/?>)',
                  r'\1\n    xmlns:tools="http://schemas.android.com/tools"\2',
                  text,
                  count=1,
              )

          if 'android.permission.INTERNET' not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*?>)',
                  r'\1\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.VIBRATE" />\n',
                  text,
                  count=1,
              )

          if 'android:networkSecurityConfig' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )

          # android.provider.AlarmClock.SET_ALARM is a normal permission, so it
          # is granted at install time, but the manifest still has to declare it
          # or the clock app silently ignores the reminder Intent.
          for permission in (
              'android.permission.VIBRATE',
              'com.android.alarm.permission.SET_ALARM',
          ):
              if f'android:name="{permission}"' not in text:
                  text = text.replace(
                      '</manifest>',
                      f'    <uses-permission android:name="{permission}" />\n</manifest>',
                      1,
                  )

          if 'android.permission.READ_EXTERNAL_STORAGE' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>',
                  1,
              )

          if 'android.permission.WRITE_EXTERNAL_STORAGE' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\n'
                  '        android:maxSdkVersion="29"\n'
                  '        tools:replace="android:maxSdkVersion" />\n</manifest>',
                  1,
              )

          if 'android.permission.READ_MEDIA_AUDIO' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n</manifest>',
                  1,
              )

          manifest_path.write_text(text, encoding='utf-8')

          # Keep Android libraries on the same supported SDK without editing cached packages.
          # 36 matches the app's compileSdk and satisfies the AAR metadata of the
          # AndroidX dependencies used by camera/mobile_scanner/just_audio.
          #
          # Patch the root build file Gradle actually loads. `flutter create` emits
          # android/build.gradle.kts; writing to android/build.gradle instead creates a
          # second root build file that Gradle prefers (the Groovy name wins), silently
          # discarding the template's `subprojects { evaluationDependsOn(":app") }` and
          # repository config. Plugin modules then evaluate before :app, and the "flutter"
          # extension they read (`flutter.compileSdkVersion`) only exists once :app has been
          # configured, so the build fails with "Could not get unknown property 'flutter'".
          gradle_path = (
              Path('android/build.gradle.kts')
              if Path('android/build.gradle.kts').exists()
              else Path('android/build.gradle')
          )
          gradle_text = gradle_path.read_text(encoding='utf-8') if gradle_path.exists() else ''
          marker = '// xiaozhi-android-subproject-compile-sdk'
          if marker not in gradle_text:
              # The override has to run after each plugin's own build script sets its compileSdk,
              # so afterEvaluate is required. The Flutter template's
              # `subprojects { project.evaluationDependsOn(":app") }` evaluates :app while the
              # root build file is still being configured, and Gradle refuses to register an
              # afterEvaluate callback on an already-evaluated project ("Cannot run
              # Project.afterEvaluate(Action) when the project is already evaluated"), so :app
              # must be skipped here. Its compileSdk is set by the app/build.gradle(.kts) patch
              # steps below.
              if gradle_path.name.endswith('.kts'):
                  gradle_text += (
                      f'\n{marker}\n'
                      'subprojects {\n'
                      '    if (name != "app") {\n'
                      '        afterEvaluate {\n'
                      '            if (plugins.hasPlugin("com.android.library")) {\n'
                      '                extensions.configure<com.android.build.api.dsl.LibraryExtension>("android") {\n'
                      '                    compileSdk = 36\n'
                      '                }\n'
                      '            }\n'
                      '        }\n'
                      '    }\n'
                      '}\n'
                  )
              else:
                  gradle_text += (
                      f'\n{marker}\n'
                      'subprojects {\n'
                      '    if (it.name != "app") {\n'
                      '        afterEvaluate { project ->\n'
                      '            def androidExtension = project.extensions.findByName("android")\n'
                      '            if (androidExtension != null) {\n'
                      '                androidExtension.compileSdkVersion(36)\n'
                      '            }\n'
                      '        }\n'
                      '    }\n'
                      '}\n'
                  )
          gradle_path.write_text(gradle_text, encoding='utf-8')

          xml_dir = Path('android/app/src/main/res/xml')
          xml_dir.mkdir(parents=True, exist_ok=True)
          security_path = xml_dir / 'network_security_config.xml'
          security_path.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <base-config cleartextTrafficPermitted="true">\n'
              '        <trust-anchors>\n'
              '            <certificates src="system" />\n'
              '        </trust-anchors>\n'
              '    </base-config>\n'
              '</network-security-config>\n',
              encoding='utf-8',
          )
          PY

          # Configure app/build.gradle for Java 17
          if [ -f android/app/build.gradle ]; then
            python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
          text = text.replace('compileSdkVersion 34', 'compileSdkVersion 36')
          text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
          text = text.replace('sourceCompatibility JavaVersion.VERSION_1_8', 'sourceCompatibility JavaVersion.VERSION_17')
          text = text.replace('targetCompatibility JavaVersion.VERSION_1_8', 'targetCompatibility JavaVersion.VERSION_17')
          text = text.replace('sourceCompatibility JavaVersion.VERSION_11', 'sourceCompatibility JavaVersion.VERSION_17')
          text = text.replace('targetCompatibility JavaVersion.VERSION_11', 'targetCompatibility JavaVersion.VERSION_17')

          if 'coreLibraryDesugaringEnabled true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
          if 'kotlinOptions' not in text and 'android {' in text:
              text = text.replace('android {', 'android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }', 1)
          if 'packagingOptions' not in text and 'android {' in text:
              text = text.replace('android {', 'android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
          desugar_dependency = 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
          if desugar_dependency not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', f'dependencies {{\n    {desugar_dependency}', 1)
              else:
                  text += f'\ndependencies {{\n    {desugar_dependency}\n}}\n'

          # AGP 8.11 with the modern plugin DSL (settings.gradle.kts) no longer
          # runs the deprecated ApkVariantOutput copy that Flutter's Gradle plugin
          # relies on, so the APK stays at build/app/outputs/apk/release and the
          # Flutter tool reports "Gradle build failed to produce an .apk file".
          # Restore that copy so `flutter build apk` can find its own output.
          # See https://github.com/flutter/flutter/issues/174620
          if 'xiaozhi-sync-flutter-apks' not in text:
              text += '''

          // xiaozhi-sync-flutter-apks
          // Flutter's Gradle plugin copies each variant output APK into
          // <rootProject>/build/app/outputs/flutter-apk/app-<abi>-<flavor>-<mode>.apk
          // via the deprecated ApkVariantOutput API, which modern AGP (8.11+,
          // declared through the settings plugin DSL) no longer executes.
          // Restore that copy so `flutter build apk` can find its own output.
          // rootProject.buildDir is <flutter project>/build (set by android/build.gradle),
          // so the destination matches getApkDirectory() in the Flutter tool.
          def flutterApkDir = file("${rootProject.buildDir}/app/outputs/flutter-apk")
          tasks.register("syncFlutterApks", Copy) {
              from(layout.buildDirectory.dir("outputs/apk/release"))
              include("*.apk")
              into(flutterApkDir)
              doFirst { flutterApkDir.mkdirs() }
          }
          // Wire lazily: the AGP tasks do not exist at configuration time, and
          // tasks.named(...) throws UnknownTaskException when the name is missing.
          tasks.whenTaskAdded {
              if (it.name == "assembleRelease" || it.name == "packageRelease") {
                  it.finalizedBy("syncFlutterApks")
              }
          }
          '''

          p.write_text(text)
          PY
          fi

          # Configure app/build.gradle.kts for Kotlin DSL
          if [ -f android/app/build.gradle.kts ]; then
            python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          text = text.replace('compileSdk = 34', 'compileSdk = 36')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          if 'isCoreLibraryDesugaringEnabled = true' not in text and 'compileOptions {' in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'jvmTarget = "17"' not in text and 'kotlinOptions' in text:
              text = text.replace('jvmTarget = "11"', 'jvmTarget = "17"')
          if 'useLegacyPackaging = true' not in text and 'android {' in text:
              text = text.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
          desugar_dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if desugar_dependency not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', f'dependencies {{\n    {desugar_dependency}', 1)
              else:
                  text += f'\ndependencies {{\n    {desugar_dependency}\n}}\n'

          # AGP 8.11 with the modern plugin DSL (settings.gradle.kts) no longer
          # runs the deprecated ApkVariantOutput copy that Flutter's Gradle plugin
          # relies on, so the APK stays at build/app/outputs/apk/release and the
          # Flutter tool reports "Gradle build failed to produce an .apk file".
          # Restore that copy so `flutter build apk` can find its own output.
          # See https://github.com/flutter/flutter/issues/174620
          if 'xiaozhi-sync-flutter-apks' not in text:
              text += '''

          // xiaozhi-sync-flutter-apks
          // Flutter's Gradle plugin copies each variant output APK into
          // <rootProject>/build/app/outputs/flutter-apk/app-<abi>-<flavor>-<mode>.apk
          // via the deprecated ApkVariantOutput API, which modern AGP (8.11+,
          // declared through the settings plugin DSL) no longer executes.
          // Restore that copy so `flutter build apk` can find its own output.
          // rootProject.buildDir is <flutter project>/build (set by android/build.gradle),
          // so the destination matches getApkDirectory() in the Flutter tool.
          val flutterApkDir = File(rootProject.buildDir, "app/outputs/flutter-apk")
          tasks.register<Copy>("syncFlutterApks") {
              from(layout.buildDirectory.dir("outputs/apk/release"))
              include("*.apk")
              into(flutterApkDir)
              doFirst { flutterApkDir.mkdirs() }
          }
          // Wire lazily: the AGP tasks do not exist at configuration time, and
          // tasks.named(...) throws UnknownTaskException when the name is missing.
          tasks.whenTaskAdded {
              if (name == "assembleRelease" || name == "packageRelease") {
                  finalizedBy("syncFlutterApks")
              }
          }
          '''

          p.write_text(text)
          PY
          fi

          # `android_intent_plus` and older Flutter plugin packages still pull AGP
          # 8.3.x, while Flutter 3.41.x with AGP 8.11+ can hit the old-vs-new DSL
          # incompatibility (`Cannot run Project.afterEvaluate` from the Flutter
          # Gradle plugin). Keep the legacy DSL enabled explicitly for this build.
          printf '\nandroid.newDsl=false\nandroid.ndk.suppressMinSdkVersionError=21\n' >> android/gradle.properties || true

      - name: Resolve dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Analyze code
        working-directory: android_app
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: android_app
        run: flutter test

      - name: Build release APK
        working-directory: android_app
        # `flutter build apk` exits 1 with "Gradle build failed to produce an .apk file"
        # when AGP 8.11+ is declared through the settings plugin DSL: the Gradle build
        # itself succeeds, but the deprecated ApkVariantOutput copy that the Flutter
        # Gradle plugin relies on never runs, so the APK is never moved to the path the
        # Flutter tool checks. The syncFlutterApks task injected above restores that
        # copy; `|| true` keeps a known-good build from being discarded when an older
        # Flutter/AGP combination still reports the false negative. The next step
        # verifies the APK exists and fails loudly if it really is missing.
        run: flutter build apk --release -v || true

      - name: Locate and verify the APK
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail

          # Candidate output locations, in the order Flutter/AGP use them:
          #  1. <flutter project>/build/app/outputs/flutter-apk/app-release.apk
          #     - where the Flutter tool and the syncFlutterApks task put it.
          #  2. <flutter project>/build/app/outputs/apk/release/app-release.apk
          #     - AGP's native output when the Flutter copy does not run.
          #  3. android/app/build/outputs/apk/release/app-release.apk
          #     - same file when the android/ project is built directly with gradlew.
          CANDIDATES=(
            "build/app/outputs/flutter-apk/app-release.apk"
            "build/app/outputs/apk/release/app-release.apk"
            "android/app/build/outputs/apk/release/app-release.apk"
          )

          FOUND=""
          for apk in "${CANDIDATES[@]}"; do
            if [ -f "$apk" ]; then
              echo "Found APK at $apk"
              FOUND="$apk"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::No release APK was produced. Searched:" >&2
            printf '  - %s\n' "${CANDIDATES[@]}" >&2
            echo "Listing build/ outputs:" >&2
            find build android/app/build -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi

          # Canonicalize to the path the upload step and `flutter install` expect.
          mkdir -p build/app/outputs/flutter-apk
          if [ "$FOUND" != "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$FOUND" "build/app/outputs/flutter-apk/app-release.apk"
          fi
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compute release metadata
        # Note: do not put a format() template containing { } inside ${{ }};
        # compute the release name in the shell instead (see build.yml).
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="v${GITHUB_REF_NAME}"
            PRE="false"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            NAME="Build #${GITHUB_RUN_NUMBER}"
            PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        # Attach the APK to the release created for this tag (release.yml), or to the
        # build-<n> prerelease when triggered manually / on a branch push.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          files: android_app/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
