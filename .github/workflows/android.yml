name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('android_app/pubspec.lock') }}

      - name: Install Android SDK platforms and build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-33" "build-tools;33.0.2" "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .

      - name: Pin Android toolchain to compatible versions
        shell: bash
        run: |
          set -euo pipefail

          # Match Flutter 3.47.x with AGP 8.7.x / Gradle 8.7.x.
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          EOF

          # Patch generated Gradle files for compatibility and native packaging.
          python - <<'PY'
from pathlib import Path

# Root build.gradle / settings.gradle patches
root_build = Path('android/build.gradle')
if root_build.exists():
    text = root_build.read_text()
    if "com.android.tools.build:gradle:8.7.2" not in text:
        text = text.replace("classpath 'com.android.tools.build:gradle:", "classpath 'com.android.tools.build:gradle:8.7.2'") if "com.android.tools.build:gradle:" in text else text
        if "dependencies {" in text and "classpath 'com.android.tools.build:gradle:8.7.2'" not in text:
            text = text.replace("dependencies {", "dependencies {\n        classpath 'com.android.tools.build:gradle:8.7.2'", 1)
        root_build.write_text(text)

settings = Path('android/settings.gradle')
if settings.exists():
    text = settings.read_text()
    if 'com.android.application' in text:
        text = text.replace('com.android.application', 'com.android.application')
    if 'version "8.7.2"' not in text and 'com.android.application' in text:
        text = text.replace('id "com.android.application"', 'id "com.android.application" version "8.7.2" apply false')
        text = text.replace('id "com.android.library"', 'id "com.android.library" version "8.7.2" apply false')
    settings.write_text(text)

# App build.gradle patches
app_build = Path('android/app/build.gradle')
if app_build.exists():
    text = app_build.read_text()

    text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
    text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
    text = text.replace('sourceCompatibility JavaVersion.VERSION_1_8', 'sourceCompatibility JavaVersion.VERSION_17')
    text = text.replace('targetCompatibility JavaVersion.VERSION_1_8', 'targetCompatibility JavaVersion.VERSION_17')
    text = text.replace('targetCompatibility JavaVersion.VERSION_11', 'targetCompatibility JavaVersion.VERSION_17')
    text = text.replace('sourceCompatibility JavaVersion.VERSION_11', 'sourceCompatibility JavaVersion.VERSION_17')

    if 'coreLibraryDesugaringEnabled true' not in text and 'compileOptions {' in text:
        text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
    if 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' not in text and 'dependencies {' in text:
        text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"', 1)
    if 'useLegacyPackaging = true' not in text and 'android {' in text:
        insertion = '\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n'
        text = text.replace('android {', 'android {' + insertion, 1)
    if 'kotlinOptions {' not in text and 'android {' in text:
        text = text.replace('android {', 'android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }', 1)
    app_build.write_text(text)

# Kotlin DSL build.gradle.kts fallback
app_build_kts = Path('android/app/build.gradle.kts')
if app_build_kts.exists():
    text = app_build_kts.read_text()
    text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
    text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
    if 'sourceCompatibility = JavaVersion.VERSION_17' not in text:
        text = text.replace('sourceCompatibility = JavaVersion.VERSION_1_8', 'sourceCompatibility = JavaVersion.VERSION_17')
        text = text.replace('targetCompatibility = JavaVersion.VERSION_1_8', 'targetCompatibility = JavaVersion.VERSION_17')
    if 'isCoreLibraryDesugaringEnabled = true' not in text and 'compileOptions {' in text:
        text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
    if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text and 'dependencies {' in text:
        text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
    if 'useLegacyPackaging = true' not in text and 'android {' in text:
        text = text.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
    if 'jvmTarget = "17"' not in text and 'kotlinOptions' in text:
        text = text.replace('jvmTarget = "11"', 'jvmTarget = "17"')
    app_build_kts.write_text(text)
PY

          printf '\nandroid.ndk.suppressMinSdkVersionError=21\n' >> android/gradle.properties

      - name: Set Android app metadata and permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="py_xiaozhi_android"/android:label="Xiaozhi"/' "$MANIFEST"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
          sed -i '/<\/application>/i\    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" />' "$MANIFEST"

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK (verbose)
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
