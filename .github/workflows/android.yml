name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 instead of ubuntu-latest: every failing run since #179
    # ran on the ubuntu-24.04 family, whose pool currently mixes image
    # versions (20261025.353.1 on #183 vs 20261101.360.1 on the passing
    # #178), while #178 is the only recent pass. The 22.04 family is a
    # different image/kernel/toolchain set and tests whether the failure
    # is tied to the 24.04 runner environment.
    runs-on: ubuntu-22.04
    # Successful builds take ~22 min; without a cap a stuck job (like run
    # #179, whose build step kept ticking with a dead log past 50 min)
    # would hang until GitHub's 360 min default. Fail fast instead.
    # Raised from 60: run #184 (ubuntu-22.04) proved the watcher failure
    # is gone, but a healthy build on 22.04 needs more than 60 min (NDK
    # download + full native compilation for 4 ABIs), and the 60 min cap
    # cancelled it mid-build ("exceeded the maximum execution time of
    # 1h0m0s"). 180 still bounds a genuinely stuck job well below
    # GitHub's 360 min default.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h
          # GitHub ubuntu runners ship many GB of toolchains this build
          # never uses. Removing them is the standard fix for
          # "No space left on device" during a Flutter/Gradle build:
          # Gradle + pub cache + NDK + build outputs need several GB,
          # and the runner's own diag log is what dies first when the
          # disk fills (see run for commit 4517f13). Java, the Android
          # SDK platforms/build-tools, and Flutter are NOT touched here.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/powershell
          sudo rm -rf /opt/microsoft
          # System images / emulator are not used by a headless APK build;
          # the SDK platforms and build-tools installed below stay.
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sudo rm -rf "$SDK_DIR/system-images" || true
          sudo rm -rf "$SDK_DIR/emulator" || true
          echo "Disk after cleanup:"
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          # Accept licenses without failing on broken pipe
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail

          # Install platforms & build-tools
          # compileSdk 36 is required by transitive AndroidX deps pulled in by the
          # Flutter plugins (androidx.camera:* 1.6.1, androidx.core 1.17.0,
          # androidx.media3 1.9.0 all declare compileSdk 35/36 in their AAR
          # metadata). android-34 is kept as a fallback for older build-tools.
          #
          # No NDK is installed here on purpose. Flutter 3.47.x / AGP 9.1.0 default
          # to NDK 28.2.13676358, which the runner image does not ship, and the
          # sdkmanager download of it is flaky on the hosted runners. Instead the
          # app's ndkVersion is pinned below to 27.3.13750724, which the runner
          # image already has, so the Flutter Gradle plugin's NDK provisioning
          # check short-circuits and never downloads anything.
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Android project structure
        working-directory: android_app
        run: |
          # If android folder doesn't exist, create it via flutter
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .
          fi

      - name: Configure Android app settings
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail

          # Pin the NDK to a version the CI runner already has installed.
          #
          # Flutter 3.47.x defaults `flutter.ndkVersion` to 28.2.13676358, which the
          # ubuntu runner image does not ship. When the configured ndkVersion is not
          # in `-Pflutter.installedNdkVersions`, the Flutter Gradle plugin runs
          # `sdkmanager --install ndk;<version>` during Gradle's configuration phase.
          # That download is flaky in CI ("Error on ZipFile unknown archive") and
          # takes the whole build down with it. Setting an explicit ndkVersion that is
          # already present makes that check short-circuit, so no download is ever
          # attempted. 27.3.13750724 is the oldest NDK on the runner image and is
          # well above the minimum AGP 9.1 accepts, so it is the safest choice.
          #
          # This is a plain shell variable rather than a $GITHUB_ENV entry because
          # every patch below runs in this same step and needs the value now; a
          # GITHUB_ENV write only applies to later steps.
          XIAOZHI_NDK_VERSION="${XIAOZHI_NDK_VERSION:-27.3.13750724}"
          export XIAOZHI_NDK_VERSION

          # Ensure the app can open sockets and reach HTTP-only media endpoints
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          text = manifest_path.read_text(encoding='utf-8') if manifest_path.exists() else (
              '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    xmlns:tools="http://schemas.android.com/tools">\n'
              '    <application\n        android:label="py_xiaozhi_android"\n        android:name="${applicationName}"\n'
              '        android:icon="@mipmap/ic_launcher">\n'
              '        <activity\n            android:name=".MainActivity"\n'
              '            android:exported="true"\n'
              '            android:launchMode="singleTop"\n'
              '            android:theme="@style/LaunchTheme"\n'
              '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"\n'
              '            android:hardwareAccelerated="true"\n'
              '            android:windowSoftInputMode="adjustResize">\n'
              '            <meta-data\n              android:name="io.flutter.embedding.android.NormalTheme"\n'
              '              android:resource="@style/NormalTheme" />\n'
              '            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n'
              '                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n'
              '        </activity>\n        <meta-data\n            android:name="flutterEmbedding"\n'
              '            android:value="2" />\n    </application>\n</manifest>\n'
          )

          # The tools namespace must be bound before any tools:replace attribute is
          # used below, otherwise AAPT fails with "unbound prefix".
          if 'xmlns:tools="http://schemas.android.com/tools"' not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*?)(/?>)',
                  r'\1\n    xmlns:tools="http://schemas.android.com/tools"\2',
                  text,
                  count=1,
              )

          if 'android.permission.INTERNET' not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*?>)',
                  r'\1\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.VIBRATE" />\n',
                  text,
                  count=1,
              )

          if 'android:networkSecurityConfig' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )

          # android.provider.AlarmClock.SET_ALARM is a normal permission, so it
          # is granted at install time, but the manifest still has to declare it
          # or the clock app silently ignores the reminder Intent.
          for permission in (
              'android.permission.VIBRATE',
              'com.android.alarm.permission.SET_ALARM',
          ):
              if f'android:name="{permission}"' not in text:
                  text = text.replace(
                      '</manifest>',
                      f'    <uses-permission android:name="{permission}" />\n</manifest>',
                      1,
                  )

          if 'android.permission.READ_EXTERNAL_STORAGE' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>',
                  1,
              )

          if 'android.permission.WRITE_EXTERNAL_STORAGE' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\n'
                  '        android:maxSdkVersion="29"\n'
                  '        tools:replace="android:maxSdkVersion" />\n</manifest>',
                  1,
              )

          if 'android.permission.READ_MEDIA_AUDIO' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n</manifest>',
                  1,
              )

          # CAPTURE_AUDIO_OUTPUT is a signature/system permission no normal
          # app can hold; an audio plugin's manifest pulls it in and it is
          # dead weight (and confusing in Play Store review). Remove it in
          # both spellings: the merged manifest carries it as
          # 'Manifest.permission.CAPTURE_AUDIO_OUTPUT' (the literal string
          # from the plugin manifest), not 'android.permission.…'.
          for _name in (
              'android.permission.CAPTURE_AUDIO_OUTPUT',
              'Manifest.permission.CAPTURE_AUDIO_OUTPUT',
          ):
              if f'android:name="{_name}"' not in text:
                  text = text.replace(
                      '</manifest>',
                      f'    <uses-permission android:name="{_name}" tools:node="remove" />\n</manifest>',
                      1,
                  )

          manifest_path.write_text(text, encoding='utf-8')

          # Keep Android libraries on the same supported SDK without editing cached packages.
          # 36 matches the app's compileSdk and satisfies the AAR metadata of the
          # AndroidX dependencies used by camera/mobile_scanner/just_audio.
          #
          # Patch the root build file Gradle actually loads. `flutter create` emits
          # android/build.gradle.kts; writing to android/build.gradle instead creates a
          # second root build file that Gradle prefers (the Groovy name wins), silently
          # discarding the template's `subprojects { evaluationDependsOn(":app") }` and
          # repository config. Plugin modules then evaluate before :app, and the "flutter"
          # extension they read (`flutter.compileSdkVersion`) only exists once :app has been
          # configured, so the build fails with "Could not get unknown property 'flutter'".
          gradle_path = (
              Path('android/build.gradle.kts')
              if Path('android/build.gradle.kts').exists()
              else Path('android/build.gradle')
          )
          gradle_text = gradle_path.read_text(encoding='utf-8') if gradle_path.exists() else ''
          marker = '// xiaozhi-android-subproject-compile-sdk'
          if marker not in gradle_text:
              # The override has to run after each plugin's own build script sets its compileSdk,
              # so afterEvaluate is required. The Flutter template's
              # `subprojects { project.evaluationDependsOn(":app") }` evaluates :app while the
              # root build file is still being configured, and Gradle refuses to register an
              # afterEvaluate callback on an already-evaluated project ("Cannot run
              # Project.afterEvaluate(Action) when the project is already evaluated"), so :app
              # must be skipped here. Its compileSdk is set by the app/build.gradle(.kts) patch
              # steps below.
              if gradle_path.name.endswith('.kts'):
                  gradle_text += (
                      f'\n{marker}\n'
                      'subprojects {\n'
                      '    if (name != "app") {\n'
                      '        afterEvaluate {\n'
                      '            if (plugins.hasPlugin("com.android.library")) {\n'
                      '                extensions.configure<com.android.build.api.dsl.LibraryExtension>("android") {\n'
                      '                    compileSdk = 36\n'
                      '                }\n'
                      '            }\n'
                      '        }\n'
                      '    }\n'
                      '}\n'
                  )
              else:
                  gradle_text += (
                      f'\n{marker}\n'
                      'subprojects {\n'
                      '    if (it.name != "app") {\n'
                      '        afterEvaluate { project ->\n'
                      '            def androidExtension = project.extensions.findByName("android")\n'
                      '            if (androidExtension != null) {\n'
                      '                androidExtension.compileSdkVersion(36)\n'
                      '            }\n'
                      '        }\n'
                      '    }\n'
                      '}\n'
                  )
          gradle_path.write_text(gradle_text, encoding='utf-8')

          xml_dir = Path('android/app/src/main/res/xml')
          xml_dir.mkdir(parents=True, exist_ok=True)
          security_path = xml_dir / 'network_security_config.xml'
          security_path.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <base-config cleartextTrafficPermitted="true">\n'
              '        <trust-anchors>\n'
              '            <certificates src="system" />\n'
              '        </trust-anchors>\n'
              '    </base-config>\n'
              '</network-security-config>\n',
              encoding='utf-8',
          )
          PY

          # Configure app/build.gradle for Java 17
          if [ -f android/app/build.gradle ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
          text = text.replace('compileSdkVersion 34', 'compileSdkVersion 36')
          text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
          # Pin the NDK to a version installed on the runner (see the manifest
          # patch above for why). `flutter.ndkVersion` resolves to 28.2.13676358,
          # which the runner does not have, so it must be overridden here.
          ndk_version = os.environ.get('XIAOZHI_NDK_VERSION', '27.3.13750724')
          text = text.replace('ndkVersion flutter.ndkVersion', f'ndkVersion "{ndk_version}"')
          text = text.replace('sourceCompatibility JavaVersion.VERSION_1_8', 'sourceCompatibility JavaVersion.VERSION_17')
          text = text.replace('targetCompatibility JavaVersion.VERSION_1_8', 'targetCompatibility JavaVersion.VERSION_17')
          text = text.replace('sourceCompatibility JavaVersion.VERSION_11', 'sourceCompatibility JavaVersion.VERSION_17')
          text = text.replace('targetCompatibility JavaVersion.VERSION_11', 'targetCompatibility JavaVersion.VERSION_17')

          if 'coreLibraryDesugaringEnabled true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
          if 'kotlinOptions' not in text and 'android {' in text:
              text = text.replace('android {', 'android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }', 1)
          if 'packagingOptions' not in text and 'android {' in text:
              text = text.replace('android {', 'android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
          desugar_dependency = 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
          if desugar_dependency not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', f'dependencies {{\n    {desugar_dependency}', 1)
              else:
                  text += f'\ndependencies {{\n    {desugar_dependency}\n}}\n'

          # AGP 8.11 with the modern plugin DSL (settings.gradle.kts) no longer
          # runs the deprecated ApkVariantOutput copy that Flutter's Gradle plugin
          # relies on, so the APK stays at build/app/outputs/apk/release and the
          # Flutter tool reports "Gradle build failed to produce an .apk file".
          # Restore that copy so `flutter build apk` can find its own output.
          # See https://github.com/flutter/flutter/issues/174620
          if 'xiaozhi-sync-flutter-apks' not in text:
              text += '''

          // xiaozhi-sync-flutter-apks
          // Flutter's Gradle plugin copies each variant output APK into
          // <rootProject>/build/app/outputs/flutter-apk/app-<abi>-<flavor>-<mode>.apk
          // via the deprecated ApkVariantOutput API, which modern AGP (8.11+,
          // declared through the settings plugin DSL) no longer executes.
          // Restore that copy so `flutter build apk` can find its own output.
          // rootProject.buildDir is <flutter project>/build (set by android/build.gradle),
          // so the destination matches getApkDirectory() in the Flutter tool.
          def flutterApkDir = file("${rootProject.buildDir}/app/outputs/flutter-apk")
          tasks.register("syncFlutterApks", Copy) {
              from(layout.buildDirectory.dir("outputs/apk/release"))
              include("*.apk")
              into(flutterApkDir)
              doFirst { flutterApkDir.mkdirs() }
          }
          // Wire lazily: the AGP tasks do not exist at configuration time, and
          // tasks.named(...) throws UnknownTaskException when the name is missing.
          tasks.whenTaskAdded {
              if (it.name == "assembleRelease" || it.name == "packageRelease") {
                  it.finalizedBy("syncFlutterApks")
              }
          }
          '''

          p.write_text(text)
          PY
          fi

          # Configure app/build.gradle.kts for Kotlin DSL
          if [ -f android/app/build.gradle.kts ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          text = text.replace('compileSdk = 34', 'compileSdk = 36')
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          # Pin the NDK to a version installed on the runner (see the manifest
          # patch above for why). `flutter.ndkVersion` resolves to 28.2.13676358,
          # which the runner does not have, so it must be overridden here.
          ndk_version = os.environ.get('XIAOZHI_NDK_VERSION', '27.3.13750724')
          text = text.replace('ndkVersion = flutter.ndkVersion', f'ndkVersion = "{ndk_version}"')
          if 'isCoreLibraryDesugaringEnabled = true' not in text and 'compileOptions {' in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'jvmTarget = "17"' not in text and 'kotlinOptions' in text:
              text = text.replace('jvmTarget = "11"', 'jvmTarget = "17"')
          if 'useLegacyPackaging = true' not in text and 'android {' in text:
              text = text.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
          desugar_dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if desugar_dependency not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', f'dependencies {{\n    {desugar_dependency}', 1)
              else:
                  text += f'\ndependencies {{\n    {desugar_dependency}\n}}\n'

          # AGP 8.11 with the modern plugin DSL (settings.gradle.kts) no longer
          # runs the deprecated ApkVariantOutput copy that Flutter's Gradle plugin
          # relies on, so the APK stays at build/app/outputs/apk/release and the
          # Flutter tool reports "Gradle build failed to produce an .apk file".
          # Restore that copy so `flutter build apk` can find its own output.
          # See https://github.com/flutter/flutter/issues/174620
          if 'xiaozhi-sync-flutter-apks' not in text:
              text += '''

          // xiaozhi-sync-flutter-apks
          // Flutter's Gradle plugin copies each variant output APK into
          // <rootProject>/build/app/outputs/flutter-apk/app-<abi>-<flavor>-<mode>.apk
          // via the deprecated ApkVariantOutput API, which modern AGP (8.11+,
          // declared through the settings plugin DSL) no longer executes.
          // Restore that copy so `flutter build apk` can find its own output.
          // rootProject.buildDir is <flutter project>/build (set by android/build.gradle),
          // so the destination matches getApkDirectory() in the Flutter tool.
          val flutterApkDir = File(rootProject.buildDir, "app/outputs/flutter-apk")
          tasks.register<Copy>("syncFlutterApks") {
              from(layout.buildDirectory.dir("outputs/apk/release"))
              include("*.apk")
              into(flutterApkDir)
              doFirst { flutterApkDir.mkdirs() }
          }
          // Wire lazily: the AGP tasks do not exist at configuration time, and
          // tasks.named(...) throws UnknownTaskException when the name is missing.
          tasks.whenTaskAdded {
              if (name == "assembleRelease" || name == "packageRelease") {
                  finalizedBy("syncFlutterApks")
              }
          }
          '''

          p.write_text(text)
          PY
          fi

          # Suppress the "minSdk < 21" error some plugins still emit without
          # disabling AGP 9's new DSL. android.newDsl=false was removed: AGP 9
          # ignores it ("The current default is 'true'. It will be removed in
          # version 10.0") and it only added deprecation warnings to the log.
          printf '\nandroid.ndk.suppressMinSdkVersionError=21\n' >> android/gradle.properties || true

      - name: Resolve dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Patch cached plugins for AGP 9
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail

          # Flutter 3.47.x ships AGP 9.1.0, which promotes several AGP-8-era
          # Kotlin DSL accessors from warnings to hard compile errors. Groovy
          # build scripts are dynamically typed, so they only warn and keep
          # building; a Kotlin DSL script that touches any of those accessors
          # fails to compile with ScriptCompilationError.
          #
          # flutter_music_picker 0.0.9 is the only dependency whose
          # android/build.gradle.kts uses all four rejected accessors
          # (`Project.android {}`, `kotlinOptions {}`, `jvmTarget`,
          # `srcDirs(...)`), so it is the only plugin that breaks. The package
          # is unmaintained (0.0.9 is its last release), so the fix is applied
          # to the pub-cache copy after `flutter pub get` rather than waiting
          # for an upstream release. Idempotent: a marker comment guards the
          # rewrite, so re-running the step is a no-op.
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          from urllib.request import url2pathname

          config_path = Path('.dart_tool/package_config.json')
          if not config_path.exists():
              raise SystemExit('::error::.dart_tool/package_config.json is missing; run flutter pub get first')

          packages = json.loads(config_path.read_text(encoding='utf-8'))['packages']
          root_uri = next((p['rootUri'] for p in packages if p['name'] == 'flutter_music_picker'), None)
          if root_uri is None:
              print('::warning::flutter_music_picker is not a dependency; nothing to patch')
              raise SystemExit(0)

          # pub-cache packages are extracted read-only for the runner user, and
          # the build script lives at <package>/android/build.gradle.kts. The
          # rootUri is a file:// URL whose shape is platform-dependent
          # (file:///home/... on Linux, file:///C:/... on Windows); url2pathname
          # decodes both, unlike a naive replace("file://", "") which leaves a
          # stray leading slash on Windows drive paths.
          root_path = Path(url2pathname(unquote(urlparse(root_uri).path)))
          script_path = root_path / 'android' / 'build.gradle.kts'
          if not script_path.exists():
              print(f'::warning::{script_path} not found (plugin has no Kotlin DSL script); skipping')
              raise SystemExit(0)

          text = script_path.read_text(encoding='utf-8')
          marker = '// xiaozhi-agp9-plugin-patch'
          if marker in text:
              print(f'{script_path} already patched; skipping')
              raise SystemExit(0)

          # Rewrite the rejected accessors to their AGP 9 equivalents:
          #   - `android { }` (the Project.android() accessor) is a *warning* for
          #     app modules but a hard *error* for LibraryExtension, so the block
          #     is re-opened through extensions.configure<LibraryExtension>("android")
          #     instead. This is the same call the root build file's compileSdk
          #     override makes and it compiles cleanly under AGP 9.
          #   - `kotlinOptions { jvmTarget = ... }` is dropped. jvmTarget is
          #     JVM-specific and not part of the extension-level compilerOptions
          #     DSL for Android targets; leaving it unset is fine because AGP
          #     derives the Kotlin jvmTarget from compileOptions' sourceCompatibility
          #     (android_intent_plus 6.1.0 sets Java 17 with no jvmTarget and
          #     compiled successfully in this same build).
          #   - `java.srcDirs("src/main/kotlin")` is dropped rather than converted
          #     to the new `directories` mutable set: src/main/kotlin is already
          #     the kotlin-android plugin's default source root, so the original
          #     line was redundant. Removing it avoids depending on an API whose
          #     path-string semantics are not yet widely exercised.
          #   - `manifest.srcFile(...)` is NOT deprecated in AGP 9, so it stays.
          patched = '''// xiaozhi-agp9-plugin-patch
          // Rewritten by CI (see .github/workflows/android.yml) for AGP 9.1.0, which
          // promotes the AGP-8-era Kotlin DSL accessors this script originally used
          // (Project.android {}, kotlinOptions {}, jvmTarget, srcDirs(...)) from
          // warnings to hard compile errors.
          plugins {
              id("com.android.library")
              id("kotlin-android")
          }

          extensions.configure<com.android.build.api.dsl.LibraryExtension>("android") {
              namespace = "com.rnd.flutter_music_picker"

              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  minSdk = 21
              }

              sourceSets {
                  getByName("main") {
                      manifest.srcFile("src/main/AndroidManifest.xml")
                  }
              }
          }

          dependencies {
              implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0")
          }
          '''

          script_path.write_text(patched, encoding='utf-8')
          print(f'Patched {script_path} for AGP 9')
          PY

      - name: Analyze code
        working-directory: android_app
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: android_app
        run: flutter test

      - name: Disable Gradle file-system watching
        working-directory: android_app
        run: |
          # Runs #179-#183 all die at the same point with a file-watcher
          # exception ("Already watching path") followed by a cancelled
          # Gradle task. Gradle's file-system watching is the one watcher
          # in the build that can be switched off from outside the tool,
          # so disabling it removes that whole failure surface. The
          # Android project (and its gradle.properties) is generated by
          # the "Create Android project structure" step above, so this
          # setting cannot live in the repo and must be written here.
          printf '%s\n' 'org.gradle.vfs.watch=false' >> android/gradle.properties
          # Run #185 died with "The hosted runner lost communication with
          # the server" — GitHub's message names CPU/memory starvation as
          # a cause. This build compiles large native libraries (sherpa_onnx
          # for 4 ABIs) and Gradle/CMake parallelise across all cores by
          # default, which can spike RAM/CPU hard enough to take the runner
          # agent itself down (its partial logs were never uploaded, hence
          # the missing build log on #185). Capping parallel workers trades
          # some speed for a runner that stays alive to finish the build.
          printf '%s\n' 'org.gradle.workers.max=2' >> android/gradle.properties

      - name: Build release APK
        working-directory: android_app
        # `flutter build apk` exits 1 with "Gradle build failed to produce an .apk file"
        # when AGP 8.11+ is declared through the settings plugin DSL: the Gradle build
        # itself succeeds, but the deprecated ApkVariantOutput copy that the Flutter
        # Gradle plugin relies on never runs, so the APK is never moved to the path the
        # Flutter tool checks. The syncFlutterApks task injected above restores that
        # copy.
        #
        # Separately, the build is flaky on this runner: runs #179-#182 all died
        # at the same point (right after the CMake install, before any
        # assembleRelease task output) with a flutter_tools file-watcher
        # exception ("Already watching path") followed by a cancelled Gradle
        # task (exit 143), while the identical workflow passed as build-178.
        # Retry the build up to 3 times: a transient watcher failure on one
        # attempt must not discard an otherwise good build. The next step
        # verifies the APK exists and fails loudly if no attempt produced one,
        # so a genuinely broken build still fails there instead of here.
        run: |
          attempt=1
          until [ "$attempt" -gt 3 ]; do
            echo "Build attempt $attempt/3"
            if flutter build apk --release; then
              break
            fi
            echo "Build attempt $attempt failed, retrying..."
            attempt=$((attempt + 1))
          done
          # Do not fail this step on the tool's exit code: the Locate step
          # below is the authority on whether an APK was actually produced
          # (this preserves the old `|| true` behaviour for the AGP copy quirk).
          true

      - name: Locate and verify the APK
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail

          # Candidate output locations, in the order Flutter/AGP use them:
          #  1. <flutter project>/build/app/outputs/flutter-apk/app-release.apk
          #     - where the Flutter tool and the syncFlutterApks task put it.
          #  2. <flutter project>/build/app/outputs/apk/release/app-release.apk
          #     - AGP's native output when the Flutter copy does not run.
          #  3. android/app/build/outputs/apk/release/app-release.apk
          #     - same file when the android/ project is built directly with gradlew.
          CANDIDATES=(
            "build/app/outputs/flutter-apk/app-release.apk"
            "build/app/outputs/apk/release/app-release.apk"
            "android/app/build/outputs/apk/release/app-release.apk"
          )

          FOUND=""
          for apk in "${CANDIDATES[@]}"; do
            if [ -f "$apk" ]; then
              echo "Found APK at $apk"
              FOUND="$apk"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::No release APK was produced. Searched:" >&2
            printf '  - %s\n' "${CANDIDATES[@]}" >&2
            echo "Listing build/ outputs:" >&2
            find build android/app/build -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi

          # Canonicalize to the path the upload step and `flutter install` expect.
          mkdir -p build/app/outputs/flutter-apk
          if [ "$FOUND" != "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$FOUND" "build/app/outputs/flutter-apk/app-release.apk"
          fi
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compute release metadata
        # Note: do not put a format() template containing { } inside ${{ }};
        # compute the release name in the shell instead (see build.yml).
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="v${GITHUB_REF_NAME}"
            PRE="false"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            NAME="Build #${GITHUB_RUN_NUMBER}"
            PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        # Attach the APK to the release created for this tag (release.yml), or to the
        # build-<n> prerelease when triggered manually / on a branch push.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          files: android_app/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
