name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('android_app/pubspec.lock') }}

      - name: Install Android SDK platforms and build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-33" "build-tools;33.0.2" "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .

      - name: Force Gradle wrapper to 8.7 and pin AGP to 8.7.2
        shell: bash
        run: |
          set -euo pipefail

          # Ensure gradle wrapper uses Gradle 8.7
          mkdir -p android/gradle/wrapper
          # Use the generated wrapper to update itself to the requested version (ignore failures first run)
          if [ -x android/gradlew ]; then
            android/gradlew wrapper --gradle-version 8.7 --distribution-type all || true
          fi
          # Overwrite distributionUrl as a fallback
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

          # Ensure Android Gradle Plugin (AGP) is pinned to 8.7.2 in android/build.gradle
          if [ -f android/build.gradle ]; then
            if grep -q "com.android.tools.build:gradle" android/build.gradle; then
              sed -i -E "s/(com.android.tools.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+/\18.7.2/" android/build.gradle || true
            else
              # Insert classpath into the first dependencies block
              perl -0777 -i -pe 's/(dependencies\s*\{)/$1\n        classpath "com.android.tools.build:gradle:8.7.2"/s' android/build.gradle || true
            fi
          fi

          # Patch android/app/build.gradle to use Java 17, enable desugaring and legacy JNI packaging
          if [ -f android/app/build.gradle ]; then
            perl -0777 -i -pe 's/compileSdkVersion\s+flutter.compileSdkVersion/compileSdkVersion 36/s' android/app/build.gradle || true
            perl -0777 -i -pe 's/minSdkVersion\s+flutter.minSdkVersion/minSdkVersion 24/s' android/app/build.gradle || true

            # Replace or add compileOptions with Java 17 + desugaring
            perl -0777 -i -pe '
                if (/compileOptions\s*\{[\s\S]*?\}/) {
                    s/compileOptions\s*\{[\s\S]*?\}/compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }/s;
                } else {
                    s/(android\s*\{)/$1\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }/s;
                }
            ' android/app/build.gradle || true

            # Ensure kotlinOptions jvmTarget = '17'
            perl -0777 -i -pe 'if (/kotlinOptions\s*\{/) { s/kotlinOptions\s*\{[^}]*\}/kotlinOptions {\n        jvmTarget = "17"\n    }/s } else { s/(android\s*\{)/$1\n    kotlinOptions {\n        jvmTarget = "17"\n    }/s }' android/app/build.gradle || true

            # Add packagingOptions -> jniLibs useLegacyPackaging = true
            perl -0777 -i -pe 'if (/packagingOptions\s*\{[\s\S]*?\}/) { } else { s/(android\s*\{)/$1\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/s }' android/app/build.gradle || true

            # Add coreLibraryDesugaring dependency if dependencies block exists
            perl -0777 -i -pe 'if (/dependencies\s*\{/) { unless (/coreLibraryDesugaring/) { s/dependencies\s*\{\s*/dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n/ } }' android/app/build.gradle || true
          fi

      - name: Set Android app metadata and permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="py_xiaozhi_android"/android:label="Xiaozhi"/' "$MANIFEST" || true
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST" || true
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST" || true
          sed -i '/<\/application>/i\    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" />' "$MANIFEST" || true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK (verbose)
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
