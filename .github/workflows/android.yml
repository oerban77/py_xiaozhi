name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          # Accept licenses without failing on broken pipe
          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail

          # Install platforms & build-tools used by the project (both 33 and 36 to support older plugins)
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-33" "build-tools;33.0.2" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Android project files (if missing)
        run: |
          # flutter create only when android folder is missing
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=py_xiaozhi_android --org=com.pyxiaozhi .
          fi

      - name: Ensure Gradle/AGP and Android settings are compatible
        shell: bash
        run: |
          set -euo pipefail

          # Force Gradle wrapper to 9.3.1 (matches AGP requirements)
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
EOF

          # Pin Android Gradle Plugin to a version compatible with Gradle 9.3.1
          if [ -f android/build.gradle ]; then
            python - <<'PY'
from pathlib import Path
p = Path('android/build.gradle')
text = p.read_text()
if 'com.android.tools.build:gradle' in text:
    # replace any existing AGP version with a compatible one
    import re
    text = re.sub(r"com.android.tools.build:gradle:[0-9]+\.[0-9]+\.[0-9]+", 'com.android.tools.build:gradle:8.9.2', text)
else:
    text = '''buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.2'
    }
}

'''+text
p.write_text(text)
PY
          fi

          # Patch module build.gradle / build.gradle.kts to ensure Java 17, desugaring and legacy JNI packaging
          if [ -f android/app/build.gradle ]; then
            python - <<'PY'
from pathlib import Path
p = Path('android/app/build.gradle')
text = p.read_text()
# Ensure compileSdk/minSdk
text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
# Ensure Java 17
text = text.replace('sourceCompatibility JavaVersion.VERSION_1_8', 'sourceCompatibility JavaVersion.VERSION_17')
text = text.replace('targetCompatibility JavaVersion.VERSION_1_8', 'targetCompatibility JavaVersion.VERSION_17')
text = text.replace('sourceCompatibility JavaVersion.VERSION_11', 'sourceCompatibility JavaVersion.VERSION_17')
text = text.replace('targetCompatibility JavaVersion.VERSION_11', 'targetCompatibility JavaVersion.VERSION_17')
# compileOptions desugaring
if 'coreLibraryDesugaringEnabled true' not in text:
    text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
# kotlinOptions jvmTarget
if 'kotlinOptions' not in text and 'android {' in text:
    text = text.replace('android {', 'android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }', 1)
# packagingOptions legacy JNI
if 'packagingOptions' not in text and 'android {' in text:
    text = text.replace('android {', 'android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
# add coreLibraryDesugaring dependency
if 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' not in text and 'dependencies {' in text:
    text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"', 1)
p.write_text(text)
PY
          fi

          if [ -f android/app/build.gradle.kts ]; then
            python - <<'PY'
from pathlib import Path
p = Path('android/app/build.gradle.kts')
text = p.read_text()
text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
if 'isCoreLibraryDesugaringEnabled = true' not in text and 'compileOptions {' in text:
    text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
if 'jvmTarget = "17"' not in text and 'kotlinOptions' in text:
    text = text.replace('jvmTarget = "11"', 'jvmTarget = "17"')
if 'useLegacyPackaging = true' not in text and 'android {' in text:
    text = text.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text and 'dependencies {' in text:
    text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
p.write_text(text)
PY
          fi

          # Suppress NDK minSdk property warning when needed
          printf '\nandroid.ndk.suppressMinSdkVersionError=21\n' >> android/gradle.properties || true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: py-xiaozhi-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
