name: Build & Upload Release Assets

on:
  push:
    tags: ["v*.*.*"]
  # Manual build: Actions -> "Build & Upload Release Assets" -> Run workflow
  # Builds without pushing a tag; artifacts are uploaded to a build-<run_number> prerelease
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - windows-x64
          - macos-arm64
          - macos-x64
          - linux-x64
          - linux-arm64

permissions:
  contents: write

jobs:
  # Same structure as xiaozhi-esp32/build-manual.yml: prepare computes the platform list first.
  # Note: a job-level if cannot reference the matrix context (GitHub rejects it with
  # "Unrecognized named-value: 'matrix'"), so platform filtering happens in prepare and
  # build only needs fromJson(needs.prepare.outputs.matrix).
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_count: ${{ steps.set-matrix.outputs.build_count }}
    steps:
      - name: Select platforms to build
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          # Tag push: build all platforms; manual build: filter by inputs.platforms
          if [ "${{ github.event_name }}" = "push" ]; then
            SELECTED="all"
          else
            SELECTED="${{ github.event.inputs.platforms }}"
          fi
          echo "Selected platforms: $SELECTED"

          # Full matrix; mac x64 builds the Intel package on the arm runner via Rosetta
          ALL_PLATFORMS='[
            {"os":"macos-latest","platform":"macos-arm64","artifact":"installer/*.dmg","mac_arch":"arm64"},
            {"os":"macos-latest","platform":"macos-x64","artifact":"installer/*.dmg","mac_arch":"x64"},
            {"os":"windows-latest","platform":"windows-x64","artifact":"installer/*.exe","mac_arch":""},
            {"os":"ubuntu-24.04","platform":"linux-x64","artifact":"installer/*.deb","mac_arch":""},
            {"os":"ubuntu-24.04-arm","platform":"linux-arm64","artifact":"installer/*.deb","mac_arch":""}
          ]'

          if [ "$SELECTED" = "all" ]; then
            PLATFORMS="$ALL_PLATFORMS"
          else
            PLATFORMS="$(echo "$ALL_PLATFORMS" | jq -c --arg p "$SELECTED" '[.[] | select(.platform == $p)]')"
          fi

          MATRIX="$(echo "$PLATFORMS" | jq -c '[.[] as $platform | ["gui", "terminal"][] as $mode | $platform + {mode: $mode}]')"
          COUNT="$(echo "$MATRIX" | jq 'length')"
          echo "Will build $COUNT package(s):"
          echo "$MATRIX" | jq -r '.[] | "  - \(.platform)-\(.mode) (\(.os))"'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "build_count=$COUNT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.build_count > 0 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.mode }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mac x64: Rosetta + a self-contained x86_64 Python
      # Avoids actions/setup-python's darwin-x64 (depends on Intel Homebrew at /usr/local/opt/gettext)
      - name: Install Rosetta (macOS x64 cross-build)
        if: runner.os == 'macOS' && matrix.mac_arch == 'x64'
        run: |
          if /usr/bin/pgrep -q oahd; then
            echo "Rosetta already installed"
          else
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install standalone x86_64 Python (macOS x64)
        if: runner.os == 'macOS' && matrix.mac_arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          # python-build-standalone: ships its own libs, no Intel Homebrew dependency
          # Bump together with upstream when the tag changes; verify the arch with file/platform after install
          RELEASE_TAG="20260718"
          PY_VER="3.10.20"
          ASSET="cpython-${PY_VER}+${RELEASE_TAG}-x86_64-apple-darwin-install_only.tar.gz"
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}/${ASSET}"
          DEST="${RUNNER_TEMP}/python-x86_64"
          mkdir -p "$DEST"
          echo "Downloading $URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/py-x64.tgz" "$URL"
          tar -xzf "$RUNNER_TEMP/py-x64.tgz" -C "$DEST"
          # The install_only archive extracts to a python/ directory
          if [ -x "$DEST/python/bin/python3" ]; then
            PY="$DEST/python/bin/python3"
          elif [ -x "$DEST/bin/python3" ]; then
            PY="$DEST/bin/python3"
          else
            echo "::error::python3 not found after extract"; find "$DEST" -maxdepth 3 -type f -name 'python*' | head
            exit 1
          fi
          echo "PY_X64=$PY" >> "$GITHUB_ENV"
          echo "$DEST/python/bin" >> "$GITHUB_PATH"
          echo "$DEST/bin" >> "$GITHUB_PATH"
          file "$PY"
          # Run the x86_64 interpreter under Rosetta
          arch -x86_64 "$PY" -c "import platform; print(platform.machine(), platform.platform(), platform.python_version())"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # arm64 builds need system portaudio/opus; x64 uses wheels + in-repo libs to avoid mixing arm Homebrew
      - name: Install system dependencies (macOS arm64)
        if: runner.os == 'macOS' && matrix.mac_arch == 'arm64'
        run: brew install portaudio opus

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev libportaudio2 \
            libopus0 libopus-dev \
            libasound-dev \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1 \
            build-essential python3-dev \
            libopenblas-dev liblapack-dev gfortran \
            libatlas-base-dev libssl-dev \
            patchelf autoconf automake libtool cmake \
            dpkg-dev fakeroot \
            meson ninja-build

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Add Inno Setup to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files (x86)/Inno Setup 6" >> $GITHUB_PATH

      - name: Install Python dependencies
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "${{ matrix.mode }}" = "terminal" ]; then
            EXTRA_ARGS+=(--extra tui)
          else
            EXTRA_ARGS+=(--extra gui)
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.mac_arch }}" = "x64" ]; then
            echo "Using x86_64 Python: $PY_X64"
            file "$PY_X64"
            arch -x86_64 "$PY_X64" -c "import platform; print(platform.machine(), platform.platform())"
            # uv uses this interpreter to resolve/install x86_64 wheels
            uv sync --python "$PY_X64" "${EXTRA_ARGS[@]}" --group dev
          else
            uv sync "${EXTRA_ARGS[@]}" --group dev
          fi

      - name: Install unifypy
        shell: bash
        run: |
          # Same project venv as uv sync (the x64 job's venv is already x86_64 Python)
          # pyinstaller must be discoverable on PATH (unifypy environment_check looks for the executable)
          uv pip install --upgrade unifypy pyinstaller

      # unifypy's _find_iss_template() always prefers the template bundled inside its own
      # package (site-packages/unifypy/templates/setup.iss.template); the project-level
      # templates/setup.iss.template is never reached. Overwrite the bundled copy so our
      # 64-bit directives reach the generated ISS and {autopf} expands to "Program Files".
      - name: Patch unifypy ISS template (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE="$(uv run --no-sync python -c "import unifypy, os; print(os.path.join(os.path.dirname(unifypy.__file__), 'templates', 'setup.iss.template'))")"
          echo "Bundled template: $TEMPLATE"
          cp templates/setup.iss.template "$TEMPLATE"
          echo "Patched directives:"
          grep -n "ArchitecturesAllowed\|ArchitecturesInstallIn64BitMode" "$TEMPLATE"

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: v2.1.2 -> 2.1.2
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Manual build: read APP_VERSION from src/constants/system.py
            # Extract only the quoted value: the spaces around " = " break sed matching
            # (unifypy would treat 'APP_VERSION = "2.1.2"' as extra args -> unrecognized arguments)
            LINE="$(grep -E '^[[:space:]]*APP_VERSION[[:space:]]*=' src/constants/system.py | head -1)"
            VERSION="$(printf '%s' "$LINE" | grep -oE '"[^"]+"' | head -1 | tr -d '"')"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine the version (missing tag or APP_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: where.exe ISCC.exe && echo "Inno Setup found"

      # Inject portable ffmpeg/ffprobe (no brew/apt/choco dynamically linked copies)
      # libs/ffmpeg/ is gitignored; injected only in CI or before a local build
      - name: Bundle portable FFmpeg into libs/
        shell: bash
        run: |
          chmod +x scripts/bundle_ffmpeg.sh
          if [ "$RUNNER_OS" = "macOS" ]; then
            # No official multi-arch static CDN for mac; extract from static-ffmpeg, no Homebrew
            # Installed into the project venv (the x64 job's venv is already x86_64)
            uv pip install static-ffmpeg
            if [ "${{ matrix.mac_arch }}" = "x64" ]; then
              # PYTHON points at the venv so static_ffmpeg is importable; arch -x86_64 makes platform.machine=x86_64
              VENV_PY="${PWD}/.venv/bin/python"
              file "$VENV_PY" || true
              arch -x86_64 env PYTHON="$VENV_PY" ./scripts/bundle_ffmpeg.sh mac x64
              file libs/ffmpeg/mac/x64/ffmpeg libs/ffmpeg/mac/x64/ffprobe
              if ! file libs/ffmpeg/mac/x64/ffmpeg | grep -Eq 'x86_64|i386'; then
                echo "::error::ffmpeg is not x86_64: $(file libs/ffmpeg/mac/x64/ffmpeg)"
                exit 1
              fi
            else
              ./scripts/bundle_ffmpeg.sh mac arm64
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ./scripts/bundle_ffmpeg.sh win x64
          else
            if [ "$(uname -m)" = "aarch64" ]; then
              ./scripts/bundle_ffmpeg.sh linux arm64
            else
              ./scripts/bundle_ffmpeg.sh linux x64
            fi
          fi

      # Inject portable copies of the external programs the MCP tools invoke
      # (nmap on Windows). libs/tools/ is gitignored; injected only in CI.
      - name: Bundle portable tools into libs/tools/
        shell: bash
        run: |
          chmod +x scripts/bundle_tools.sh
          ./scripts/bundle_tools.sh

      - name: Configure macOS target architecture for unifypy
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # unifypy passes pyinstaller.target_architecture through
          TARGET="arm64"
          if [ "${{ matrix.mac_arch }}" = "x64" ]; then
            TARGET="x86_64"
          fi
          # Any available Python can edit the JSON
          if [ -n "${PY_X64:-}" ] && [ -x "${PY_X64:-}" ]; then
            PY="$PY_X64"
          else
            PY="$(command -v python3 || command -v python)"
          fi
          "$PY" - <<PY
          import json
          from pathlib import Path
          path = Path("build.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))
          cfg.setdefault("pyinstaller", {})["target_architecture"] = "${TARGET}"
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"pyinstaller.target_architecture = {cfg['pyinstaller']['target_architecture']}")
          PY

      - name: Configure GUI or terminal package
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mode = "${{ matrix.mode }}"
          cfg = json.loads(Path("build.json").read_text(encoding="utf-8"))
          package_name = f"{cfg['name']}-{mode}"
          cfg["name"] = package_name
          cfg.setdefault("pyinstaller", {})["windowed"] = mode == "gui"
          if mode == "gui":
              cfg["pyinstaller"]["hidden_import"] = [
                  name for name in cfg["pyinstaller"].get("hidden_import", [])
                  if name != "textual"
              ]
          else:
              cfg["entry"] = "terminal_entry.py"
              hidden_imports = cfg["pyinstaller"].setdefault("hidden_import", [])
              cfg["pyinstaller"]["hidden_import"] = [
                name for name in hidden_imports if name != "qasync"
              ]
              cfg["pyinstaller"]["hidden_import"].append("textual.widgets._tab_pane")
          macos = cfg.setdefault("platforms", {}).get("macos", {})
          if macos.get("bundle_identifier"):
              macos["bundle_identifier"] = f"{macos['bundle_identifier']}.{mode}"
          linux = cfg["platforms"].get("linux", {}).get("deb", {})
          if linux.get("package"):
              linux["package"] = package_name

          output = Path(f"build-{mode}.json")
          output.write_text(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Configured {mode} package: windowed={cfg['pyinstaller']['windowed']}, config={output}")
          PY

      - name: Build package
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          rm -f *.spec
          # unifypy>=2.0.18: --version only prints the tool version and exits; use --app-version for the app
          #
          # Do not run uv with arch -x86_64 (the uv binary is arm64 -> Bad CPU type).
          # mac x64: put .venv/bin on PATH so unifypy finds the x86_64 pyinstaller;
          # run the venv's x86_64 python -m unifypy and the core goes through Rosetta automatically.
          export PATH="${PWD}/.venv/bin:${PATH}"
          BUILD_CONFIG="build-${{ matrix.mode }}.json"
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.mac_arch }}" = "x64" ]; then
            VENV_PY="${PWD}/.venv/bin/python"
            file "$VENV_PY"
            command -v pyinstaller
            pyinstaller --version || true
            "$VENV_PY" -c "import PyInstaller, platform; print(PyInstaller.__version__, platform.machine())"
            "$VENV_PY" -m unifypy . \
              --config "$BUILD_CONFIG" \
              --app-version ${{ steps.version.outputs.version }} \
              --verbose \
              --clean
          else
            uv run --no-sync unifypy . \
              --config "$BUILD_CONFIG" \
              --app-version ${{ steps.version.outputs.version }} \
              --verbose \
              --clean
          fi

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Find the main executable inside the .app and verify it matches the matrix arch
          app="$(find dist -name '*.app' -type d | head -1 || true)"
          if [ -z "$app" ]; then
            echo "::warning::No .app found; skipping arch check (still relies on the installer artifact check)"
            exit 0
          fi
          bin="$app/Contents/MacOS/$(basename "$app" .app)"
          if [ ! -f "$bin" ]; then
            bin="$(find "$app/Contents/MacOS" -type f -perm -111 | head -1)"
          fi
          echo "Binary: $bin"
          file "$bin"
          lipo -info "$bin" || true
          EXPECT="arm64"
          if [ "${{ matrix.mac_arch }}" = "x64" ]; then
            EXPECT="x86_64"
          fi
          if ! lipo -info "$bin" 2>/dev/null | grep -q "$EXPECT"; then
            if ! file "$bin" | grep -q "$EXPECT"; then
              echo "::error::Expected arch $EXPECT, got: $(file "$bin")"
              exit 1
            fi
          fi
          echo "Architecture OK: $EXPECT"

      - name: Rename artifact with platform suffix
        shell: bash
        run: |
          mkdir -p dist/release
          shopt -s nullglob
          files=(${{ matrix.artifact }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer artifact found: ${{ matrix.artifact }} (unifypy may have succeeded without building)"
            ls -la installer 2>/dev/null || true
            exit 1
          fi
          for f in "${files[@]}"; do
            ext="${f##*.}"
            base="${f%.*}"
            name="$(basename "$base")"
            cp "$f" "dist/release/${name}-${{ matrix.platform }}-${{ matrix.mode }}.${ext}"
          done
          ls -lh dist/release

      # Tag push: use the triggering tag; manual build: a separate build-<run_number> prerelease
      # Note: do not put a format() template containing { } inside ${{ }}
      # (e.g. 'Build #{0} (v{1})'); the GitHub workflow parser fails with
      # "The expression is not closed", so tag/name/prerelease are computed in the shell instead
      - name: Compute release metadata
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="$TAG"
            PRE="false"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            NAME="Build #${GITHUB_RUN_NUMBER} (v${{ steps.version.outputs.version }})"
            PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          body: |
            **Platform:** ${{ matrix.platform }}
            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}
            **Trigger:** ${{ github.event_name }}
          files: dist/release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
