name: py_xiaozhi_android
description: Native mobile client for the Xiaozhi voice assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  flutter_sound: ^9.30.0
  opus_dart: ^3.0.1
  opus_flutter: ^3.0.3
  record: ^7.1.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true