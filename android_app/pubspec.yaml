name: py_xiaozhi_android
description: Native mobile client for the Xiaozhi voice assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  archive: ^4.3.0
  camera: 0.11.3
  # Pinned to ^2.4.7: 2.4.8 pulls pdfrx_engine ^0.4.7, which requires meta ^1.18.0
  # and breaks version solving against the Flutter SDK's pinned meta 1.17.0.
  # The APIs used (PdfDocument.openData, loadText, pages, dispose) are unchanged.
  pdfrx: ^2.4.7
  # Pinned to 5.3.1: 6.0.0+ requires Android Gradle Plugin >=8.12.1 and Gradle
  # >=8.13, which the CI's `flutter create` template does not provide. The only
  # APIs used (AndroidIntent({action, arguments}) + launch()) are identical.
  android_intent_plus: 5.3.1
  flutter_music_picker: ^0.0.9
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  flutter_volume_controller: ^1.3.4
  file_picker: ^8.1.7
  flutter_sound: ^9.30.0
  mqtt_client: ^10.2.1
  mobile_scanner: ^7.4.2
  media_store_plus: ^0.1.3
  network_info_plus: ^6.1.4
  opus_dart: ^3.0.1
  opus_flutter: ^3.0.3
  permission_handler: ^11.0.0
  record: 6.1.2
  shared_preferences: ^2.5.3
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3
  html: ^0.15.6
  just_audio: ^0.9.46
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Wake word (keyword spotting) model, mirroring models/en in the Python client.
    # Bundled as assets and copied to a writable dir at runtime (see
    # lib/wake_word_detector.dart) because Android apps are sandboxed.
    - assets/models/en/
    # Emotion animations, mirroring assets/emojis in the Python client
    # (src/ui/gui/services/emotion_service.py). Shown in the chat header next to
    # the status and the live TTS text, exactly like the desktop GUI.
    - assets/emojis/