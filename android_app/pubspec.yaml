name: py_xiaozhi_android
description: Native mobile client for the Xiaozhi voice assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  camera: ^0.12.1
  flutter_local_notifications: ^18.0.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  flutter_volume_controller: ^1.3.4
  file_picker: ^8.1.7
  flutter_sound: ^9.30.0
  mqtt_client: ^10.2.1
  mobile_scanner: ^7.4.2
  opus_dart: ^3.0.1
  opus_flutter: ^3.0.3
  permission_handler: ^11.0.0
  record: ^7.1.1
  shared_preferences: ^2.5.3
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  flutter_timezone: ^5.1.1
  web_socket_channel: ^3.0.3
  html: ^0.15.6
  just_audio: ^0.9.46
  timezone: ^0.10.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Wake word (keyword spotting) model, mirroring models/en in the Python client.
    # Bundled as assets and copied to a writable dir at runtime (see
    # lib/wake_word_detector.dart) because Android apps are sandboxed.
    - assets/models/en/