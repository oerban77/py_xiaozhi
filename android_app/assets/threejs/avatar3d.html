<!doctype html>
<!--
  3D avatar viewer (PoC) for py_xiaozhi: renders a .glb character with
  three.js and drives its face morph targets from the app's lip-sync
  frames. Same architecture as the Live2D avatar (WebView + JS bridge),
  but a real 3D model instead of a Cubism model.

  Why not flutter_3d_controller / model-viewer: Google's model-viewer
  public API (materials/variants only, see its scene-graph api.ts) has
  NO morph-target access, and the runtime Model keeps the three.js scene
  behind Symbol-keyed privates (model.ts) -- there is no stable way to
  reach the meshes. This page loads the model with three.js directly, so
  morph targets are first-class: mesh.morphTargetDictionary by name.

  three.js is bundled with the app (three.module.min.js r160 +
  the matching GLTFLoader / RoomEnvironment / BufferGeometryUtils
  addons, all under assets/threejs/), and so is the default model --
  so the 3D avatar opens instantly with no download and works
  offline. A custom model URL (http/https) still loads on demand.

  The page is served to the WebView by a tiny loopback HTTP server
  (see Avatar3dServer in Dart), NOT with loadFlutterAsset: that would
  serve it as a file:// URL, and Chrome/WebView refuses to load ES
  modules (and fetch() a .glb) from file:// -- module fetches are
  CORS-checked and a file:// page has an opaque (null) origin. Over
  http://127.0.0.1 the imports below resolve normally. Deliberately
  NO import map: the imports are plain relative paths (and the addons
  import three.js via a relative path too), so the page needs only ES
  module support, not import-map support.

  Dart API (window.__avatar3d):
    loadModel(url)            -- load a .glb (replaces the current model)
    setMorphs({name: 0..1})   -- set face morph weights by target name
    playAnimation(name?)      -- play a clip by name (first clip if omitted)
    loadAnimationClip(url)    -- load a separate .glb of clips (e.g. Mixamo)
                                and play its first clip on this skeleton
    playGesture(name, ms?)    -- play a named gesture (see GESTURES):
                                wave, nod, shake, bow, happy, sad,
                                surprised, angry, think, look_left,
                                look_right, look_up, look_down, dance.
                                Returns true if the gesture exists.
  Dart is notified through the Avatar3d JavaScriptChannel:
    {type:'loaded', animations:[...], morphs:[...]}
    {type:'error', message:'...'}
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from './three.module.min.js';
import { GLTFLoader } from './addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from './addons/environments/RoomEnvironment.js';

const channel = (msg) => {
  try {
    if (window.Avatar3d) window.Avatar3d.postMessage(JSON.stringify(msg));
  } catch (e) { /* channel not attached (standalone browser test) */ }
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Neutral studio environment so PBR skin/clothes do not look flat or
// black without an env map (Ready Player Me models are metal-rough).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 2.4);

const hemi = new THREE.HemisphereLight(0xffffff, 0x1a2e2b, 0.9);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(1.5, 2.5, 2.0);
scene.add(key);

const loader = new GLTFLoader();
const clock = new THREE.Clock();
let model = null;
let mixer = null;
let morphMeshes = []; // [{mesh, dict}] cached at load; morphs set per frame.
let morphNames = [];

function frameCamera(object) {
  // Fit the model's height into the view with a small margin, so a
  // half-body model fills the stage like Haru does. A full-body model
  // is framed head-to-waist instead of whole: framed whole, its face
  // would shrink to a fraction of the stage and the talking mouth
  // would be too small to see.
  //
  // Do NOT use Box3.setFromObject here: for a SkinnedMesh it uses the
  // cached SkinnedMesh.boundingBox, which is computed from the
  // skeleton's bone matrices -- at load time (before the first render)
  // those are stale, so the box comes out tiny and near the origin
  // (x +-0.12, y -0.08..0.22 for halfBody) instead of the real model
  // (x +-0.84, y 0.25..0.79). The camera then looks below the model
  // and the model is out of frame -- the stage stays empty even though
  // the model loaded and the loop runs (proven 2026-11-06: 8621
  // triangles drawn, 0 pixels, camera at y 0.09 looking at y 0.07).
  // Use the geometry bounding boxes (bind pose) instead: they are
  // correct at load time and do not depend on the skeleton.
  object.updateWorldMatrix(false, true);
  const box = new THREE.Box3();
  object.traverse((node) => {
    if (node.isMesh && node.geometry) {
      if (node.geometry.boundingBox === null) {
        node.geometry.computeBoundingBox();
      }
      box.union(
        node.geometry.boundingBox.clone().applyMatrix4(node.matrixWorld),
      );
    }
  });
  if (box.isEmpty()) return; // keep the default camera position.
  // Full-body model (height > 1 m): keep only its top 40% (head to
  // waist) in the frame, so the face stays large on screen -- close
  // to the half-body man's -- instead of shrinking to a fraction of
  // the stage. The bottom half is simply out of frame below.
  if (box.max.y - box.min.y > 1.0) {
    box.min.y = box.max.y - (box.max.y - box.min.y) * 0.4;
  }
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const halfH = Math.max(size.y, 0.5) / 2;
  const dist = (halfH / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.25;
  camera.position.set(center.x, center.y + size.y * 0.05, center.z + dist);
  camera.lookAt(center.x, center.y, center.z);
  camera.updateProjectionMatrix();
}

function disposeModel() {
  if (!model) return;
  scene.remove(model);
  model.traverse((node) => {
    if (node.isMesh) {
      node.geometry?.dispose?.();
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      mats.forEach((m) => { m?.dispose?.(); });
    }
  });
  mixer = null;
  morphMeshes = [];
  morphNames = [];
  gestureBones = {};
  activeGesture = null;
  model = null;
}

function playClip(name) {
  if (!mixer || !model) return false;
  const clips = mixer._clips ?? [];
  const clip = name
    ? clips.find((c) => c.name === name) ?? null
    : clips[0] ?? null;
  if (!clip) return false;
  mixer.stopAllAction();
  mixer.clipAction(clip).reset().setLoop(THREE.LoopRepeat).play();
  return true;
}

async function loadModel(url) {
  disposeModel();
  // A relative URL (the bundled model) resolves against this page's
  // own asset URL, so it loads from the app bundle with no download;
  // an absolute http(s) URL passes through unchanged.
  const resolved = new URL(url, window.location.href).href;
  try {
    const gltf = await loader.loadAsync(resolved);
    model = gltf.scene;
    scene.add(model);
    frameCamera(model);
    // Cache every mesh that carries morph targets, so setMorphs never
    // traverses the scene per frame (up to 50 calls a second).
    morphMeshes = [];
    const names = new Set();
    model.traverse((node) => {
      if (node.isMesh && node.morphTargetDictionary) {
        morphMeshes.push({ mesh: node, dict: node.morphTargetDictionary });
        Object.keys(node.morphTargetDictionary).forEach((n) => names.add(n));
      }
    });
    morphNames = [...names];
    // Cache the bones gestures rotate (Head, arms, spine) with their
    // base rotations, so a gesture can offset them and restore them.
    _cacheGestureBones();
    // Skeletal clips embedded in the model (halfBody: idle_eyes, hand
    // poses). A playing clip keeps the render loop meaningful and the
    // eyes alive; prefer the idle clip when the model has one.
    mixer = new THREE.AnimationMixer(model);
    mixer._clips = gltf.animations || [];
    const idle = (gltf.animations || []).find((c) => /idle/i.test(c.name));
    if (idle) playClip(idle.name);
    else if (gltf.animations && gltf.animations.length > 0) playClip();
    channel({
      type: 'loaded',
      animations: (gltf.animations || []).map((c) => c.name),
      morphs: morphNames,
    });
    return true;
  } catch (e) {
    channel({ type: 'error', message: 'loadModel failed: ' + (e?.message || e) });
    return false;
  }
}

function setMorphs(weights) {
  if (!model || morphMeshes.length === 0) return false;
  for (const { mesh, dict } of morphMeshes) {
    const inf = mesh.morphTargetInfluences;
    if (!inf) continue;
    for (const name in weights) {
      const idx = dict[name];
      if (idx !== undefined) {
        const v = weights[name];
        inf[idx] = Math.min(1, Math.max(0, typeof v === 'number' ? v : 0));
      }
    }
  }
  return true;
}

// ---------------------------------------------------------------------------
// Gestures (MCP avatar_gesture): named movements the LLM can trigger.
// A gesture is a function of progress p (0..1) returning {morphs, bones}:
//   morphs: {targetName: 0..1} -- face expression morphs, written every
//     frame in the render loop while the gesture is active, so they win
//     over Dart's 30 Hz mouth ticker (which writes mouth morphs only).
//   bones: {boneName: {x, y, z}} -- rotation offsets in radians, added
//     to the bone's base (bind-pose) rotation.
// The envelope rises in the first 20%, holds, and falls in the last
// 20%; oscillating gestures (nod/shake/wave/dance) multiply a sine by
// it. Bones are found by name at load time; a gesture part is skipped
// silently when its bone does not exist (e.g. a half-body model has no
// legs, and the wave degrades to a head tilt + smile instead of
// failing). When the gesture ends, bones return to their base rotation
// and expression morphs return to 0.
// ---------------------------------------------------------------------------
let gestureBones = {}; // {Head, Neck, Spine, RightShoulder, RightArm, RightForeArm, LeftArm, ...}
let activeGesture = null; // {name, start, duration}

const _smooth = (t) => t * t * (3 - 2 * t); // smoothstep 0..1
function _envelope(p) {
  if (p < 0.2) return _smooth(p / 0.2);
  if (p > 0.8) return _smooth((1 - p) / 0.2);
  return 1;
}
function _osc(p, cycles) {
  return Math.sin(p * cycles * Math.PI * 2) * _envelope(p);
}

const GESTURES = {
  // Wave: right arm raised up beside the head, forearm waving, slight
  // head tilt + smile. (Proven by axis test: the shoulder's local X
  // raises the arm sideways/up; Z swings it forward, not up. +1.7
  // puts the hand beside the head; +2.1 bends the elbow awkwardly.)
  wave: (p) => ({
    morphs: { mouthSmile: 0.7 * _envelope(p), cheekSquintLeft: 0.4 * _envelope(p), cheekSquintRight: 0.4 * _envelope(p) },
    bones: {
      RightShoulder: { x: 1.7 * _envelope(p), y: 0, z: 0 },
      RightArm: { x: 0.3 * _envelope(p), y: 0, z: 0 },
      RightForeArm: { x: 0, y: 0, z: 0.6 * _osc(p, 3) },
      Head: { x: 0, y: 0, z: 0.12 * _envelope(p) },
    },
  }),
  // Nod: head down/up twice.
  nod: (p) => ({
    morphs: {},
    bones: { Head: { x: 0.28 * _osc(p, 2), y: 0, z: 0 } },
  }),
  // Shake: head left/right twice.
  shake: (p) => ({
    morphs: {},
    bones: { Head: { x: 0, y: 0.4 * _osc(p, 2), z: 0 } },
  }),
  // Bow: spine + head forward, then back.
  bow: (p) => ({
    morphs: {},
    bones: {
      Spine: { x: 0.45 * _envelope(p), y: 0, z: 0 },
      Head: { x: 0.2 * _envelope(p), y: 0, z: 0 },
    },
  }),
  // Happy: big smile, squinted eyes, slight head tilt.
  happy: (p) => ({
    morphs: {
      mouthSmile: 0.85 * _envelope(p),
      mouthSmileLeft: 0.85 * _envelope(p),
      mouthSmileRight: 0.85 * _envelope(p),
      eyeSquintLeft: 0.5 * _envelope(p),
      eyeSquintRight: 0.5 * _envelope(p),
      cheekSquintLeft: 0.5 * _envelope(p),
      cheekSquintRight: 0.5 * _envelope(p),
    },
    bones: { Head: { x: 0, y: 0, z: 0.1 * _envelope(p) } },
  }),
  // Sad: frown, inner brows raised, head slightly down.
  sad: (p) => ({
    morphs: {
      mouthFrown: 0.7 * _envelope(p),
      browInnerUp: 0.6 * _envelope(p),
      mouthFrownLeft: 0.6 * _envelope(p),
      mouthFrownRight: 0.6 * _envelope(p),
    },
    bones: { Head: { x: 0.12 * _envelope(p), y: 0, z: 0 } },
  }),
  // Surprised: wide eyes, raised brows, jaw dropped.
  surprised: (p) => ({
    morphs: {
      eyeWideLeft: 0.8 * _envelope(p),
      eyeWideRight: 0.8 * _envelope(p),
      browInnerUp: 0.7 * _envelope(p),
      jawOpen: 0.4 * _envelope(p),
      mouthOpen: 0.3 * _envelope(p),
    },
    bones: { Head: { x: -0.08 * _envelope(p), y: 0, z: 0 } },
  }),
  // Angry: brows down, frown, squinted eyes.
  angry: (p) => ({
    morphs: {
      browDownLeft: 0.8 * _envelope(p),
      browDownRight: 0.8 * _envelope(p),
      mouthFrown: 0.5 * _envelope(p),
      eyeSquintLeft: 0.4 * _envelope(p),
      eyeSquintRight: 0.4 * _envelope(p),
    },
    bones: {},
  }),
  // Think: one brow raised, lips pursed, head tilted.
  think: (p) => ({
    morphs: {
      browInnerUp: 0.5 * _envelope(p),
      mouthPucker: 0.3 * _envelope(p),
    },
    bones: { Head: { x: 0, y: 0, z: 0.18 * _envelope(p) } },
  }),
  // Look directions: head turns, holds, returns.
  look_left: (p) => ({
    morphs: {},
    bones: { Head: { x: 0, y: 0.55 * _envelope(p), z: 0 } },
  }),
  look_right: (p) => ({
    morphs: {},
    bones: { Head: { x: 0, y: -0.55 * _envelope(p), z: 0 } },
  }),
  look_up: (p) => ({
    morphs: {},
    bones: { Head: { x: -0.3 * _envelope(p), y: 0, z: 0 } },
  }),
  look_down: (p) => ({
    morphs: {},
    bones: { Head: { x: 0.3 * _envelope(p), y: 0, z: 0 } },
  }),
  // Dance: whole-model sway + head bob + arms out.
  dance: (p) => ({
    morphs: { mouthSmile: 0.6 * _envelope(p) },
    bones: {
      Head: { x: 0, y: 0, z: 0.15 * _osc(p, 2) },
      Spine: { x: 0, y: 0, z: 0.12 * _osc(p, 2) },
      LeftArm: { x: 0.9 * _envelope(p), y: 0, z: 0 },
      RightArm: { x: 0.9 * _envelope(p), y: 0, z: 0 },
    },
  }),
};

const GESTURE_ALIASES = {
  lambaian: 'wave', angguk: 'nod', geleng: 'shake', membungkuk: 'bow',
  senang: 'happy', sedih: 'sad', terkejut: 'surprised', marah: 'angry',
  berpikir: 'think', lihat_kiri: 'look_left', lihat_kanan: 'look_right',
  lihat_atas: 'look_up', lihat_bawah: 'look_down', menari: 'dance',
  // English aliases
  lookleft: 'look_left', lookright: 'look_right', lookup: 'look_up',
  lookdown: 'look_down',
};

function playGesture(name, durationMs) {
  if (!model) return false;
  const key = String(name || '').toLowerCase().replace(/[\s-]+/g, '_');
  const canonical = GESTURES[key] ? key : GESTURE_ALIASES[key];
  if (!canonical || !GESTURES[canonical]) return false;
  const duration = Math.min(10000, Math.max(400, durationMs || 2000));
  activeGesture = { name: canonical, start: performance.now(), duration };
  return true;
}

function _applyGesture(now) {
  if (!activeGesture) return;
  const p = (now - activeGesture.start) / activeGesture.duration;
  if (p >= 1) {
    // Gesture finished: restore bones to base rotation and clear the
    // expression morphs it wrote. Mouth morphs are left alone: Dart's
    // ticker rewrites them every 33 ms anyway.
    for (const [boneName, base] of Object.entries(gestureBones)) {
      const bone = base.bone;
      bone.rotation.set(base.x, base.y, base.z);
    }
    const def = GESTURES[activeGesture.name];
    if (def) {
      const done = def(1);
      if (done.morphs) {
        const zeroed = {};
        for (const k of Object.keys(done.morphs)) zeroed[k] = 0;
        setMorphs(zeroed);
      }
    }
    activeGesture = null;
    return;
  }
  const def = GESTURES[activeGesture.name];
  if (!def) { activeGesture = null; return; }
  const pose = def(p);
  if (pose.morphs) setMorphs(pose.morphs);
  if (pose.bones) {
    for (const [boneName, rot] of Object.entries(pose.bones)) {
      const base = gestureBones[boneName];
      if (!base) continue;
      base.bone.rotation.set(
        base.x + (rot.x || 0),
        base.y + (rot.y || 0),
        base.z + (rot.z || 0),
      );
    }
  }
}

function _cacheGestureBones() {
  gestureBones = {};
  if (!model) return;
  const wanted = ['Head', 'Neck', 'Spine', 'Hips', 'LeftShoulder', 'RightShoulder', 'LeftArm', 'RightArm', 'LeftForeArm', 'RightForeArm', 'LeftHand', 'RightHand'];
  model.traverse((node) => {
    if (node.isBone && wanted.includes(node.name)) {
      gestureBones[node.name] = {
        bone: node,
        x: node.rotation.x, y: node.rotation.y, z: node.rotation.z,
      };
    }
  });
}

async function loadAnimationClip(url) {
  // A Mixamo-style .glb that holds only clips (no meshes): bind its
  // first clip to this model's skeleton by bone name and play it. The
  // Ready Player Me skeleton uses the same humanoid bone names as
  // Mixamo, so the retarget is by name, no manual mapping.
  if (!model || !mixer) return false;
  try {
    const gltf = await loader.loadAsync(url);
    const clip = (gltf.animations || [])[0];
    if (!clip) return false;
    mixer.stopAllAction();
    mixer.clipAction(clip, model).reset().setLoop(THREE.LoopRepeat).play();
    return true;
  } catch (e) {
    channel({ type: 'error', message: 'loadAnimationClip failed: ' + (e?.message || e) });
    return false;
  }
}

window.__avatar3d = { loadModel, setMorphs, playAnimation: playClip, loadAnimationClip, playGesture };
// Debug probe (used by the headless render tests only): exposes the
// cached gesture bones and the active gesture so a test can confirm a
// gesture actually rotated a bone.
window.__avatar3dDebug = {
  gestureBones: () => Object.keys(gestureBones),
  boneRotation: (name) => {
    const b = gestureBones[name];
    if (!b) return null;
    return { x: b.bone.rotation.x, y: b.bone.rotation.y, z: b.bone.rotation.z };
  },
  // Set a bone rotation directly (absolute, radians) for axis tests.
  setBone: (name, x, y, z) => {
    const b = gestureBones[name];
    if (!b) return false;
    b.bone.rotation.set(x, y, z);
    return true;
  },
  baseRotation: (name) => {
    const b = gestureBones[name];
    if (!b) return null;
    return { x: b.x, y: b.y, z: b.z };
  },
  activeGesture: () => (activeGesture ? activeGesture.name : null),
};
window.__avatar3dReady = true;
// Tell Dart the page API exists. Dart must NOT load the model from
// onPageFinished: <script type="module"> executes after the page
// finishes parsing, so at onPageFinished time window.__avatar3d is
// usually still undefined -- that race left the PoC stuck on the
// spinner with no model.
channel({ type: 'ready' });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('error', (e) => {
  channel({ type: 'error', message: 'page error: ' + (e?.message || e) });
});

// The loop runs continuously: the mixer advances here and morph weights
// set from Dart show on the very next frame, so no explicit re-render
// trigger is needed (unlike model-viewer, which only renders on demand).
//
// Visible idle life: the model's own `idle_eyes` clip only rotates the
// eyeballs a few degrees (4 channels on the two eye bones) -- at phone
// distance that reads as a frozen statue, which is what the first
// device test showed. So the loop adds two things the clip cannot:
//   (a) a slow sway + breathing bob of the whole model (rotation and
//       position only -- no clip touches the root, so nothing fights),
//   (b) a blink: every few seconds both eyelids close for ~180 ms via
//       the eyeBlinkLeft/Right morphs. Dart's setMorphs only writes the
//       mouth morphs it is given, so the blink never clashes with the
//       talking mouth.
let idleTime = 0;
let nextBlinkAt = 2.5;
let blinkT = -1;
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  idleTime += dt;
  if (mixer) mixer.update(dt);
  if (model) {
    model.rotation.y = Math.sin(idleTime * 0.45) * 0.04;
    model.position.y = Math.sin(idleTime * 1.1) * 0.01;
  }
  // A gesture overrides the head/body bones and expression morphs
  // while it runs; it restores them when it ends. It runs after the
  // mixer so it wins over the idle clip on the bones it touches.
  _applyGesture(performance.now());
  if (blinkT < 0 && idleTime >= nextBlinkAt) blinkT = 0;
  let blink = 0;
  if (blinkT >= 0) {
    blinkT += dt;
    const blinkDur = 0.18;
    blink =
      blinkT < blinkDur ? Math.sin((blinkT / blinkDur) * Math.PI) : 0;
    if (blinkT >= blinkDur) {
      blinkT = -1;
      nextBlinkAt = idleTime + 2.5 + Math.random() * 3;
    }
  }
  for (const { mesh, dict } of morphMeshes) {
    const li = dict['eyeBlinkLeft'];
    const ri = dict['eyeBlinkRight'];
    if (li !== undefined) mesh.morphTargetInfluences[li] = blink;
    if (ri !== undefined) mesh.morphTargetInfluences[ri] = blink;
  }
  renderer.render(scene, camera);
});

// Standalone browser test: ?model=<url> loads it without Dart.
const params = new URLSearchParams(window.location.search);
if (params.get('model')) loadModel(params.get('model'));
</script>
</body>
</html>
